  <main class="content">
    <section class="gallery" id="gallery"></section>

    <script>
      // Newest first: 38 -> 1 (skips 23)
      const paintings = [
        "38_Irises_About_to_Bloom_WebTEXT.jpg",
        "37_10-31-23_WebTEXT.jpg",
        "36_11-01-02_WebTEXT.jpg",
        "35_11-01-02_WebTEXT.jpg",
        "34_Rainbows_and_Daffodils_WebTEXT.jpg",
        "33_Rain_Storm_WebTEXT.jpg",
        "32_Untitled_2023_WebTEXT.jpg",
        "31_Opening_Your_Eyes_Underwater_WebTEXT.jpg",
        "30_Coming_Up_WebTEXT.jpg",
        "29_Untitled_2022_WebTEXT.jpg",
        "39_Untitled_2021_WebTEXT.jpg",
        "28_Moss_Rose_Purslane_July_17_WebTEXT.jpg",
        "27_A_Quiet_Death_WebTEXT.jpg",
        "26_Daffodils_I_WebTEXT.jpg",
        "25_Daffodils_II_WebTEXT.jpg",
        "24_Daffodils_III_WebTEXT.jpg",
        "22_Daffodils_1_WebTEXT.jpg",
        "21_Daffodils_2_WebTEXT.jpg",
        "20_Daffodils_3_WebTEXT.jpg",
        "19_April_8_WebTEXT.jpg",
        "18_01_Untitled_WebTEXT.jpg",
        "17_February_25_WebTEXT.jpg",
        "16_Untitled_WebTEXT.jpg",
        "15_January_13_WebTEXT.jpg",
        "14_December_19_WebTEXT.jpg",
        "13_December_16_WebTEXT.jpg",
        "12_Nove_12_WebTEXT.jpg",
        "11_November_6_WebTEXT.jpg",
        "10_December_Snow_WebTEXT.jpg",
        "9_In_the_Light_WebTEXT.jpg",
        "8_Chicago_WebTEXT.jpg",
        "7_October_Snow_WebTEXT.jpg",
        "6_24_Hours_After_October_Snow_WebTEXT.jpg",
        "5_Between_Fall_and_Winter_WebTEXT.jpg",
        "4_Golden_Hour_WebTEXT.jpg",
        "3_Golden_Hour_Bleached_WebTEXT.jpg",
        "2_When_the_Park_Flooded_WebTEXT.jpg",
        "1_At_the_Resevoir_WebTEXT.jpg"
      ];

      const gallery = document.getElementById("gallery");

      paintings.forEach((filename) => {
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        img.src = `images/${filename}`;
        img.alt = "";
        img.loading = "lazy";
        fig.appendChild(img);
        gallery.appendChild(fig);
      });
    </script>
  </main>

  <script>
    (function(){
      var btn = document.querySelector('.menu-toggle');
      var nav = document.querySelector('.nav');
      if(!btn||!nav) return;
      btn.addEventListener('click', function(){
        btn.classList.toggle('open');
        nav.classList.toggle('open');
      });
      // close menu when a nav link is tapped
      nav.querySelectorAll('a').forEach(function(a){
        a.addEventListener('click', function(){
          btn.classList.remove('open');
          nav.classList.remove('open');
        });
      });
    })();
  </script>
