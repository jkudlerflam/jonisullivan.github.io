<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joni Sullivan — Exhibits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar">
    <a class="site-title" href="index.html">JONI<br>SULLIVAN</a>
    <button class="menu-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav">
      <a href="index.html">Painting</a>

      <details>
        <summary class="nav-label">Exhibits</summary>
        <div class="nav-sub">
          <a href="exhibits-mfa-2021.html">"MFA CLASS OF<br>2021 EXHIBITION"</a>
          <a href="exhibits-during-dessert.html">"DURING DESSERT"</a>
        </div>
      </details>

      <details>
        <summary class="nav-label">Writing</summary>
        <div class="nav-sub">
          <a href="writing-about-art.html">About Art</a>
        </div>
      </details>

      <a href="contact.html">Contact</a>
      <a href="cv.html">CV</a>
    </nav>
  </aside>

  <main class="content">
    <div class="page-block">
      <p>Select an exhibit from the navigation.</p>
    </div>
  </main>

  <script>
    (function(){
      var btn = document.querySelector('.menu-toggle');
      var nav = document.querySelector('.nav');
      if(!btn||!nav) return;
      btn.addEventListener('click', function(){
        btn.classList.toggle('open');
        nav.classList.toggle('open');
      });
      // close menu when a nav link is tapped
      nav.querySelectorAll('a').forEach(function(a){
        a.addEventListener('click', function(){
          btn.classList.remove('open');
          nav.classList.remove('open');
        });
      });
    })();
  </script>
</body>
</html>
